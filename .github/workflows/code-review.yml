---
name: Code Review - Linting & Link Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run github/super-linter
        uses: github/super-linter@2d64ac1c067c34beaf7d24cc12733cd46236f76e # v4.9.5
        env:
          # Lint all code - disabled in as part of #262
          VALIDATE_ALL_CODEBASE: false
          # Need to define main branch as default is set to master in super-linter
          DEFAULT_BRANCH: main
          # Enable setting the status of each individual linter run in the Checks section of a pull request
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The following linter types will be enabled:
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_POWERSHELL: true
          VALIDATE_YAML: true
          #YAMLLINT_CONFIG_FILE: .github/linters/.yamllint.yml
          #VALIDATE_EDITORCONFIG: true
          # Disable errors to only generate a report
          #DISABLE_ERRORS: true

  markdown-link-check:
    name: Markdown Link Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@master
        with:
          fetch-depth: 0

      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@80f93864bef8919dc990cd59f7a9aab9361d688c # v1.2.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_on_error: true
          config_file: ".github/actions-config/.linkspector.yml"
